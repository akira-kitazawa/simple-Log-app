<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5測定システム - Web BLE コントローラー</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #34495e; padding-bottom: 10px; }
        h2 { color: #34495e; margin-top: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-panel { padding: 15px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .disconnected { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .connected { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .btn-start { background-color: #2ecc71; }
        .btn-start:hover { background-color: #27ae60; }
        .btn-stop { background-color: #e74c3c; }
        .btn-stop:hover { background-color: #c0392b; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
        .node-card { background: #ecf0f1; border-top: 5px solid #bdc3c7; padding: 15px; border-radius: 4px; text-align: center; }
        .node-card.active-data { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .node-val { font-size: 24px; font-weight: bold; margin: 10px 0; color: #2c3e50; }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .setting-box { background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #e0e0e0; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 60px; padding: 5px; font-size: 14px; }
        .checkbox-group label { display: inline-block; margin-right: 10px; font-weight: normal; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>M5測定システム Web BLE コントローラー</h1>

    <!-- 接続ステータス -->
    <div id="statusBanner" class="status-panel disconnected">
        <span id="statusText">状態: 未接続</span>
        <button id="btnConnect" onclick="connectBLE()">親機に接続する</button>
    </div>

    <!-- 遠隔コマンド操作 -->
    <h2>遠隔操作</h2>
    <div style="margin-bottom: 20px;">
        <button id="btnStart" class="btn-start" onclick="sendControlCommand(1)" disabled>▶ 計測開始</button>
        <button id="btnStop" class="btn-stop" onclick="sendControlCommand(2)" disabled>■ 計測停止</button>
    </div>

    <!-- リアルタイムデータ数値表示 -->
    <h2>子機データリアルタイム表示</h2>
    <div class="grid-cards">
        <!-- CH1〜5のカード。親機のカラーコードに準拠 -->
        <div id="card1" class="node-card" style="border-top-color: #e74c3c;"><h3>CH1 (必須)</h3><div id="val1" class="node-val">---</div><small id="time1">--:--:--</small></div>
        <div id="card2" class="node-card" style="border-top-color: #2ecc71;"><h3>CH2</h3><div id="val2" class="node-val">---</div><small id="time2">--:--:--</small></div>
        <div id="card3" class="node-card" style="border-top-color: #3498db;"><h3>CH3</h3><div id="val3" class="node-val">---</div><small id="time3">--:--:--</small></div>
        <div id="card4" class="node-card" style="border-top-color: #f1c40f;"><h3>CH4</h3><div id="val4" class="node-val">---</div><small id="time4">--:--:--</small></div>
        <div id="card5" class="node-card" style="border-top-color: #9b59b6;"><h3>CH5</h3><div id="val5" class="node-val">---</div><small id="time5">--:--:--</small></div>
    </div>

    <!-- 遠隔設定変更パネル -->
    <div class="control-panel">
        <div class="setting-box">
            <h2>遠隔設定変更</h2>
            <div class="form-group">
                <label>計測インターバル:</label>
                <input type="number" id="intH" min="0" max="23" value="0"> 時間 
                <input type="number" id="intM" min="0" max="59" value="0"> 分 
                <input type="number" id="intS" min="1" max="59" value="1"> 秒
            </div>
            <div class="form-group">
                <label>対象子機の選択:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="node1" checked disabled> CH1</label>
                    <label><input type="checkbox" id="node2" checked> CH2</label>
                    <label><input type="checkbox" id="node3"> CH3</label>
                    <label><input type="checkbox" id="node4"> CH4</label>
                    <label><input type="checkbox" id="node5"> CH5</label>
                </div>
            </div>
            <button id="btnSaveConfig" onclick="sendConfigCommand()" disabled>設定を親機に保存する</button>
        </div>
        <div class="setting-box" style="background:#f0f4f8;">
            <h2>通信デバッグログ</h2>
            <div id="debugLog" style="height: 140px; overflow-y: scroll; font-family: monospace; font-size: 12px; background: white; padding: 10px; border: 1px solid #ddd;"></div>
        </div>
    </div>
</div>

<script>
// 親機スケッチと完全に一致させるUUID
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_TX_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8"; // Notify受け取り用
const CHARACTERISTIC_RX_UUID = "c3b2e59e-2212-4c28-bb73-774f2603cd70"; // Write送り込み用

let bleDevice = null;
let rxCharacteristic = null; // PC -> M5 (Write)
let txCharacteristic = null; // M5 -> PC (Notify)

function log(msg) {
    const logDiv = document.getElementById('debugLog');
    logDiv.innerHTML += msg + '<br>';
    logDiv.scrollTop = logDiv.scrollHeight;
}

// BLE接続ロジック
async function connectBLE() {
    if (bleDevice && bleDevice.gatt.connected) {
        log("切断中...");
        await bleDevice.gatt.disconnect();
        return;
    }

    try {
        log("M5Stackをスキャン中...");
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'M5Stack_Master_BLE' }],
            optionalServices: [SERVICE_UUID]
        });

        log("GATTサーバーに接続中...");
        const server = await bleDevice.gatt.connect();

        log("サービスを取得中...");
        const service = await server.getPrimaryService(SERVICE_UUID);

        log("キャラクタリスティクスを取得中...");
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX_UUID);
        txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_TX_UUID);

        // Notifyの開始
        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', handleDataNotification);

        // UI状態の更新
        document.getElementById('statusBanner').className = "status-panel connected";
        document.getElementById('statusText').innerText = "状態: 親機と接続中 (" + bleDevice.name + ")";
        document.getElementById('btnConnect').innerText = "切断する";
        setControlsDisabled(false);
        log("🎉 BLE通信の確立に成功しました！");

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    } catch (error) {
        log("❌ エラー: " + error);
    }
}

function onDisconnected() {
    document.getElementById('statusBanner').className = "status-panel disconnected";
    document.getElementById('statusText').innerText = "状態: 未接続";
    document.getElementById('btnConnect').innerText = "親機に接続する";
    setControlsDisabled(true);
    log("🔌 BLEが切断されました。");
}

function setControlsDisabled(disabled) {
    document.getElementById('btnStart').disabled = disabled;
    document.getElementById('btnStop').disabled = disabled;
    document.getElementById('btnSaveConfig').disabled = disabled;
}

// 💡 M5Stack（親機）から構造体データを受信したときのパース処理
function handleDataNotification(event) {
    const value = event.target.value;
    
    // DataPacket構造体のバイト長 = 1 + 4 + 4 + 4 + 2 + 1 + 1 + 1 + 1 + 1 = 20バイト
    if (value.byteLength < 20) return; 

    const view = new DataView(value.buffer);
    
    // 構造体のパッキング順（リトルエンディアン）に沿って展開
    let offset = 0;
    const nodeId     = view.getUint8(offset);     offset += 1;
    const sequence   = view.getUint32(offset, true); offset += 4;
    const sensorVal1 = view.getFloat32(offset, true); offset += 4; // Lux値
    const sensorVal2 = view.getFloat32(offset, true); offset += 4; // IR値
    const year       = view.getUint16(offset, true); offset += 2;
    const month      = view.getUint8(offset);     offset += 1;
    const day        = view.getUint8(offset);     offset += 1;
    const hour       = view.getUint8(offset);     offset += 1;
    const minute     = view.getUint8(offset);     offset += 1;
    const second     = view.getUint8(offset);     offset += 1;

    // 画面に受信値を反映
    if (nodeId >= 1 && nodeId <= 5) {
        const card = document.getElementById(`card${nodeId}`);
        card.classList.add('active-data');
        
        document.getElementById(`val${nodeId}`).innerText = sensorVal1.toFixed(1) + " lx";
        
        const timeStr = `${year}/${String(month).padStart(2,'0')}/${String(day).padStart(2,'0')} ${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}`;
        document.getElementById(`time${nodeId}`).innerText = timeStr;
        
        log(`[受信] CH${nodeId} | Seq:${sequence} | Lux:${sensorVal1.toFixed(1)} | 時刻:${hour}:${minute}:${second}`);
    }
}

// 💡 PC -> M5Stack へ開始(1)・停止(2) コマンド送信
async function sendControlCommand(type) {
    if (!rxCharacteristic) return;
    
    // PcCommandPacket構造体のサイズ = 1 + 1 + 1 + 1 + 5 = 9バイト

    const buffer = new ArrayBuffer(9);
    const view = new DataView(buffer);
    view.setUint8(0, type); // 1: 開始, 2: 停止
    view.setUint8(1, 0); // interval_h (ダミー)
    view.setUint8(2, 0); // interval_m (ダミー)
    view.setUint8(3, 1); // interval_s (ダミー)
    // active_nodes (5つ分のブール値をダミー充当)
    for(let i=0; i<5; i++) view.setUint8(4 + i, 0);
    try {
        await rxCharacteristic.writeValue(buffer);
        log(type === 1 ? "▶ 「計測開始」指示を送信しました" : "■ 「計測停止」指示を送信しました");
    } catch (error) {
        log("❌ コマンド送信失敗: " + error);
    }	
}
// 💡 PC -> M5Stack へ設定一括変更(3) コマンド送信
async function sendConfigCommand() {
    if (!rxCharacteristic) return;
    const h = parseInt(document.getElementById('intH').value) || 0;
    const m = parseInt(document.getElementById('intM').value) || 0;
    const s = parseInt(document.getElementById('intS').value) || 1;
    const buffer = new ArrayBuffer(9);
    const view = new DataView(buffer);
    view.setUint8(0, 3); // type = 3 (設定変更)
    view.setUint8(1, h);
    view.setUint8(2, m);
    view.setUint8(3, s);
    // 5台分の子機ON/OFF状態を1バイトずつ書き込み
    for(let i=0; i<5; i++) {
        const isChecked = document.getElementById(node${i+1}).checked ? 1 : 0;
        view.setUint8(4 + i, isChecked);
    }
    try {
        await rxCharacteristic.writeValue(buffer);
        log(⚙️ 新設定を送信: インターバル[${h}h ${m}m ${s}s]);
    } catch (error) {
        log("❌ 設定送信失敗: " + error);
    }
}
