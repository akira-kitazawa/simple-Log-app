<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BLEテスト</title>
</head>
<body>

    <h1>M5Stack BLE 最小接続テスト</h1>
    
    <!-- 💡 ボタンの書き方はこれで正しいです -->
    <button id="btnConnect" onclick="connectBLE()">M5Stackに接続する</button>
    
    <p>ステータス: <span id="bleStatus">未接続</span></p>
    
    <hr>
    <h3>ブラウザ内デバッグログ:</h3>
    <div id="logArea" style="background:#eee; padding:10px; min-height:100px; font-family:monospace; white-space:pre-wrap;"></div>

<script>
// UUID定義
const SERVICE_UUID           = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHARACTERISTIC_TX_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const CHARACTERISTIC_RX_UUID = "c3b2e59e-2212-4c28-bb73-774f2603cd70";

let bleDevice = null;

function myLog(text) {
    console.log(text);
    document.getElementById("logArea").innerText += text + "\n";
}

async function connectBLE() {
    myLog("--- 接続処理を開始します ---");
    try {
        myLog("1. BLEデバイスを探しています...");
        bleDevice = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [SERVICE_UUID]
        });
        
        myLog("2. デバイスが見つかりました: " + bleDevice.name);
        myLog("3. GATTサーバーに接続中...");
        const server = await bleDevice.gatt.connect();
        
        myLog("4. サービスを取得中...");
        const service = await server.getPrimaryService(SERVICE_UUID);
        
        myLog("5. 接続成功！");
        document.getElementById("bleStatus").innerText = "接続済み";
        document.getElementById("bleStatus").style.color = "green";
        
    } catch (error) {
        myLog("❌ エラー発生: " + error);
    }
}
</script>

</body>
</html>
